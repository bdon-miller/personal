[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiftyfm"
version = "0.1.0"
description = "Weekly historical Billboard chart -> Spotify playlist -> Discord"
requires-python = ">=3.11"
dependencies = [
    "billboard.py>=7.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fiftyfm = "fiftyfm.cli:main"

[tool.setuptools.package-data]
fiftyfm = ["charts.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
