[schedule]
start_date = 1976-01-03
weeks_per_run = 3
# Priority lists for week slots 1-3. Week 4 (and a 5th run in a month)
# draws from the wildcard pool: every available chart not taken by a slot.
slots = [
    ["hot-100"],
    ["mainstream-rock", "soul"],
    ["rap", "soul", "country"],
]

